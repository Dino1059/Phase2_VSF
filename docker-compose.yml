version: "3.8"

services:
  datatrust-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datatrust-os
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DataTrust OS
      - APP_ENV=production
      - APP_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
