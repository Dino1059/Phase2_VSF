version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data_new:/app/data_new
      - ./data:/app/data
      - ./landing_data:/app/landing_data:ro
      - ./eval:/app/eval:ro
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DUCKDB_PATH=data_new/db/vingroup_pilot.db
      - CORS_ORIGINS=*
      # t086 / datatrust-os: production disables mock-token. d086 override must set APP_ENV=development.
      - APP_ENV=production
      - GIT_SHA=${GIT_SHA:-}
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: datatrust-cloudflared
    restart: always
    network_mode: host
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_KEY}
    depends_on:
      - backend
      - frontend

