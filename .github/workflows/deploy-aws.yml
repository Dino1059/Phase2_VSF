name: CI/CD AWS

on:
  push:
    branches: [mvp]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: datatrust-aws-production
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datatrust
          POSTGRES_USER: datatrust
          POSTGRES_PASSWORD: ci-datatrust-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datatrust -d datatrust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: datatrust
      POSTGRES_USER: datatrust
      POSTGRES_PASSWORD: ci-datatrust-password
      DATABASE_URL: postgresql://datatrust:ci-datatrust-password@127.0.0.1:5432/datatrust
      DATATRUST_PSEUDONYMIZATION_KEY: ci-only-pseudonymization-key-at-least-32-bytes
      GOOGLE_AI_API_KEY: test-dummy-key
      OPENAI_API_KEY: test-dummy-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the production application image (Dockerfile).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check undefined Python names
        run: python -m ruff check backend dags database src tests --select F821,F823

      - name: Bootstrap test database
        run: python -m database.bootstrap_render

      - name: Load and profile fixture datasets
        run: |
          python -m database.reset_and_ingest_bronze
          python -m database.profiler_engine

      - name: Run backend tests
        # These two tests validate historical production state rather than an
        # isolated CI database. Runtime reconciliation is covered after deploy.
        run: >-
          python -m pytest -q --ignore=tests/benchmarks
          -k "not test_database_historical_runs_reconciliation
          and not test_database_persistence_integration"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

  deploy:
    name: Deploy to AWS EC2
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::122552374341:role/datatrust-github-deploy
          aws-region: ap-southeast-1

      - name: Read stack outputs
        id: stack
        shell: bash
        run: |
          instance_id="$(aws cloudformation describe-stacks \
            --stack-name datatrust-os \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)"
          app_url="$(aws cloudformation describe-stacks \
            --stack-name datatrust-os \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue" \
            --output text)"
          test -n "$instance_id"
          test -n "$app_url"
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

      - name: Deploy exact commit through SSM
        id: deploy
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          jq -n --arg sha "$TARGET_SHA" '{commands: [
            "set -euo pipefail",
            "echo DATATRUST_DEPLOY_WRAPPER_STAGE=app_directory",
            "cd /opt/datatrust",
            "echo DATATRUST_DEPLOY_WRAPPER_STAGE=source_fetch",
            "git fetch --prune origin mvp",
            "echo DATATRUST_DEPLOY_WRAPPER_STAGE=script_extract",
            ("git show " + $sha + ":scripts/deploy_aws.sh > /tmp/datatrust-deploy.sh"),
            "sed -i 's/\\r$//' /tmp/datatrust-deploy.sh",
            "chmod 700 /tmp/datatrust-deploy.sh",
            "bash -n /tmp/datatrust-deploy.sh",
            "echo DATATRUST_DEPLOY_WRAPPER_STAGE=deploy_script",
            ("DATATRUST_APP_DIR=/opt/datatrust bash /tmp/datatrust-deploy.sh " + $sha)
          ]}' > ssm-parameters.json

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy DataTrust $TARGET_SHA" \
            --timeout-seconds 1800 \
            --parameters file://ssm-parameters.json \
            --query Command.CommandId \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                invocation="$(aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID")"
                stderr="$(jq -r '.StandardErrorContent // empty' <<<"$invocation")"
                stdout="$(jq -r '.StandardOutputContent // empty' <<<"$invocation")"
                failed_stage="$(printf '%s\n%s' "$stdout" "$stderr" \
                  | grep -oE 'DATATRUST_DEPLOY_FAILED_STAGE=[a-z_]+' \
                  | tail -n 1 | cut -d= -f2 || true)"
                wrapper_stage="$(printf '%s\n%s' "$stdout" "$stderr" \
                  | grep -oE 'DATATRUST_DEPLOY_WRAPPER_STAGE=[a-z_]+' \
                  | tail -n 1 | cut -d= -f2 || true)"
                response_code="$(jq -r '.ResponseCode // "unknown"' <<<"$invocation")"
                echo "::error title=AWS SSM deployment failed::wrapper=${wrapper_stage:-unknown}, stage=${failed_stage:-unknown}, response_code=$response_code"
                exit 1
                ;;
            esac
            sleep 10
          done

          final_status="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"
          test "$final_status" = Success

      - name: Verify public health
        env:
          APP_URL: ${{ steps.stack.outputs.app_url }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --max-time 10 "$APP_URL/ready"
          echo "::notice title=DataTrust AWS endpoint::$APP_URL/ready"
