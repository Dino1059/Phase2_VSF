name: CI Quality Gate

# runs-on: self-hosted → org eph-vmrunner-* in runner group "default"
# (machine vm-runner, workdir /home/gh-runner/eph/<hex>/). Not ubuntu-latest:
# hosted dies in ~2s on org spend cap (see ci-hosted-probe.yml).
#
# Last green on this PR (33229495730 PR + 33229494187 push @ 9ef05b5) used
# feat/** push + pull_request and concurrency github.ref so the two events
# do not cancel each other. 4cf3879 dropped feat push and unified the
# concurrency key; 33255172365 then sat queued with identical labels
# ["self-hosted"] and was never claimed. Restore the last-green triggers.
# There is no workflow_run / reusable provisioner in this repo; the
# eph-vmrunner controller lives on host vm-runner (org, not P-086).
# workflow_dispatch lets an operator re-queue after that controller starts.
# Do not register a new self-hosted runner on the chat host.
on:
  workflow_dispatch:
  push:
    branches: [main, develop, v5, "feat/**", "ci/**", "fix/**"]
  pull_request:
    branches: [main, develop, v5]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint & Pytest Gate
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python Dependencies
        run: |
          uv sync --frozen

      - name: Lint with Ruff
        run: |
          # Error-class only: undefined-name / undefined-local. Default E/F/I/N/W/UP is ~1800 pre-existing style hits (UP006/UP045/F401/I001) and would require a mass reformat.
          uv run ruff check src/ tests/ --select F821,F823

      - name: Run Pytest Test Suite
        run: |
          uv run pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          GOOGLE_AI_API_KEY: test-dummy-key
          OPENAI_API_KEY: test-dummy-key

  frontend-quality:
    name: Frontend Typecheck & Build Gate
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: |
          pnpm --dir frontend install --ignore-workspace

      - name: Typecheck and Build Frontend
        run: |
          pnpm --dir frontend run build
